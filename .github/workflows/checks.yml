name: Kiểm tra mã và nội dung
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kiểm tra cú pháp JavaScript
        run: |
          node --check app.js
          node --check voices.js
          node --check online.js
          node --check config.js
          node --check classroom3d.js
          node --check data.js
          node --check guides.js
          node --check questions.js
      - name: Kiểm tra chương trình và ngân hàng câu hỏi
        run: node scripts/verify-content.cjs
      - name: Kiểm tra giọng nữ và âm thanh bài giảng
        run: node scripts/verify-voices.cjs
      - name: Kiểm tra máy chủ và hai học sinh online
        run: |
          node online-server/build.mjs
          node online-server/tests/server.test.mjs
          node online-server/tests/daily.test.mjs
          node online-server/tests/standalone.test.mjs
          node online-server/tests/cloudflare-onboarding.test.mjs
          node scripts/verify-online-client.mjs
          node scripts/verify-admin-page.mjs
