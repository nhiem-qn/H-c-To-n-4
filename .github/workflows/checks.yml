name: Kiểm tra mã và nội dung
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kiểm tra cú pháp JavaScript
        run: |
          node --check app.js
          node --check voices.js
          node --check online.js
          node --check rewards.js
          node --check exam-teacher.js
          node --check exam-audio.js
          node --check learning.js
          node --check advisor-core.js
          node --check advisor.js
          node --check admin-advisor.js
          node --check lesson-studio.js
          node --check studio-player.js
          node --check studio-audio.js
          node --check config.js
          node --check classroom3d.js
          node --check world3d.js
          node --check data.js
          node --check guides.js
          node --check questions.js
      - name: Kiểm tra chương trình và ngân hàng câu hỏi
        run: node scripts/verify-content.cjs
      - name: Kiểm tra giọng nữ và âm thanh bài giảng
        run: |
          node scripts/verify-voices.cjs
          node scripts/verify-exam-teacher.cjs
          node scripts/verify-exam-playback.mjs
          node scripts/verify-learning.cjs
          node scripts/verify-advisor.cjs
          node scripts/verify-studio-player.mjs
          node scripts/verify-studio-content.cjs
      - name: Kiểm tra máy chủ và hai học sinh online
        run: |
          node online-server/build.mjs
          node online-server/tests/server.test.mjs
          node online-server/tests/daily.test.mjs
          node online-server/tests/contests.test.mjs
          node online-server/tests/learning.test.mjs
          node online-server/tests/rewards.test.mjs
          node online-server/tests/student-terms.test.mjs
          node online-server/tests/advisor.test.mjs
          node online-server/tests/standalone.test.mjs
          node online-server/tests/cloudflare-onboarding.test.mjs
          node scripts/verify-online-client.mjs
          node scripts/verify-admin-page.mjs
